<style>
:root{color-scheme:dark;font-family:"DM Sans",system-ui,sans-serif;background:#080a0e;color:#e9e9e6}*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#17212a 0%,#080a0e 65%)}

.eyebrow{color:#9caab4;letter-spacing:.24em;text-transform:uppercase;font-size:.72rem}

a:hover{border-color:#b8c5cc;background:#ffffff08;transform:translateY(-2px)}a:focus-visible{outline:2px solid #c6d2da;outline-offset:4px}
.number{font-size:.78rem;letter-spacing:.18em;color:#687680;margin-bottom:1rem}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

</style>
